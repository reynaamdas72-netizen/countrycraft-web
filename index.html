
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CountryCraft Launcher</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial, Helvetica, sans-serif;

            background: linear-gradient(
                to bottom,
                #18c95d 0%,
                #08783b 30%,
                #03170c 65%,
                #000000 100%
            );

            color: white;
        }

        .download-box {
            width: 90%;
            max-width: 470px;
            padding: 42px;

            text-align: center;

            background: rgba(0, 0, 0, 0.40);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 22px;

            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.55);

            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .logo {
            width: 85px;
            height: 85px;

            margin: 0 auto 24px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 20px;

            background: rgba(25, 200, 90, 0.15);
            border: 1px solid rgba(40, 220, 110, 0.35);

            font-size: 42px;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 29px;
            font-weight: 700;
        }

        .description {
            margin-bottom: 28px;

            color: rgba(255, 255, 255, 0.65);
            font-size: 15px;
        }

        .download-button {
            display: block;
            width: 100%;

            padding: 16px 20px;

            border-radius: 12px;

            background: #20c965;
            color: white;

            text-decoration: none;

            font-size: 17px;
            font-weight: bold;

            transition:
                background 0.15s ease,
                transform 0.15s ease,
                box-shadow 0.15s ease;
        }

        .download-button:hover {
            background: #2ade72;
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(32, 201, 101, 0.35);
        }

        .download-button:active {
            transform: translateY(0);
        }

        .file-info {
            margin-top: 18px;

            color: rgba(255, 255, 255, 0.4);
            font-size: 12px;
        }
    </style>
</head>

<body>

    <div class="download-box">

        <div class="logo">
            ↓
        </div>

        <h1>CountryCraft Launcher</h1>

        <div class="description">
            Descarga el launcher oficial de CountryCraft.
        </div>

        <a
            class="download-button"
            href="https://www.mediafire.com/file/zvmite4tf4gzyic/CountryCraftLauncher-Setup.exe/file"
        >
            Descargar Launcher
        </a>

        <div class="file-info">
            CountryCraftLauncher-Setup.exe · 48.41MB
        </div>

    </div>

</body>
</html>
